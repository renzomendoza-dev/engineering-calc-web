name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR pushes get cancelled; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # src/lib/config.ts throws at import time without this. The value is only baked into the
      # build output here, never used to call anything.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # matches the Dockerfile's node:24-alpine
          cache: npm

      - run: npm ci

      # Runs `next typegen` first: global helpers like LayoutProps live in generated .next/types,
      # which a fresh checkout doesn't have.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # Catches the frontend's mirrored types drifting from calc-api's DTOs -- a field added to a DTO
  # and never mirrored here breaks nothing in either repo's own checks, so neither repo can catch
  # it alone. Its own job: it needs the backend checked out, and a backend-side failure shouldn't
  # read as this app's typecheck or tests failing.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # CALC_API_READ_TOKEN is only needed while renzomendoza-dev/engineering-calc is private;
      # for a public repo the default token is enough. Without a valid token the checkout fails
      # loudly rather than the check passing on a missing backend (see --require below).
      - name: Check out calc-api
        uses: actions/checkout@v7
        with:
          repository: renzomendoza-dev/engineering-calc
          path: calc-api-source
          token: ${{ secrets.CALC_API_READ_TOKEN || github.token }}

      - name: Check the API contract
        run: npm run check:contract -- --api ./calc-api-source --require
